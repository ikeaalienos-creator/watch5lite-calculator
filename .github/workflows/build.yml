name: Build RPK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build RPK
        run: npm run build

      - name: Show build result
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== DIST ====="
          ls -la dist 2>/dev/null || true
          echo "===== BUILD ====="
          ls -la build 2>/dev/null || true
          echo "===== ALL RPK FILES ====="
          find . -type f -name "*.rpk" -print
          echo "===== ALL FILES ====="
          find dist build -type f -print 2>/dev/null || true

      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-rpk
          path: "**/*.rpk"
          if-no-files-found: error
